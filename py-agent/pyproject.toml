[project]
name = "ravita-agent-ai"
version = "0.1.0"
description = "Autonomous coding agent powered by LangChain + LangGraph + Anthropic Claude"
requires-python = ">=3.11"
dependencies = [
    "langchain==1.2.15",
    "langchain-core==1.2.28",
    "langchain-anthropic==1.4.0",
    "langchain-google-genai==4.2.1",
    "langchain-openai==1.1.12",
    "langgraph==1.1.6",
    "python-dotenv==1.1.0",
    "prompt_toolkit>=3.0",
]

[project.scripts]
ravita = "main:main"

[dependency-groups]
dev = []
